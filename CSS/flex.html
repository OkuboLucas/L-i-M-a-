<!DOCTYPE html>
<html lang = "pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Flex</title>
    <style>
        .container{
            display: flex; /* O flex é dito se queremos empilhar os elementos ou empilha-los lado a lado */
            flex-direction: row;
            justify-content: space-evenly; /* space-around leva em conta o espaço entre os elementos, enquanto o space-between joga as duas extremidades nos cantos da página e separa o resto dos espaços*/
            background-color: cornflowerblue;
            flex-wrap: wrap;
            height: 400px;
            align-items: center;
            align-content: center;
           
        }  
        .container div{
            background-color: #f1f1f1;
            width: 100px;
            margin: 10px;
            padding: 10px;
            text-align: center;
            font-size: 20px;
            border: 1px solid rgb(59, 80, 119);
            transition: 0.5s ease; 
            border-radius: 2.5px;
        }
        .container div:hover{
            background-color: #ababab;


        }
    </style>
</head>
<body>
    <h1>Flex</h1>
    <p>Para usar o flex é necessário haver um elemento ancestral com estilização display: flex</p>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>0</div>
    </div>
</body>
</html>
